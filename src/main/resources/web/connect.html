<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect • TickScope</title><link rel="stylesheet" href="style.css">
</head>
<body class="connect-body">
<main class="connect-wrap">
  <section class="connect-card">
    <div class="logo">TS</div>
    <div class="eyebrow">TICKSCOPE CLOUD / LOCAL</div>
    <h1>Connect your server</h1>
    <p class="muted">Use the URL of the TickScope web API and the token generated by that server.</p>
    <label>API URL</label>
    <input id="apiUrl" placeholder="http://127.0.0.1:8765" autocomplete="url">
    <label>Server token</label>
    <input id="token" type="password" placeholder="TS_..." autocomplete="off">
    <button class="primary wide" onclick="connect()">Connect server</button>
    <div id="status" class="connect-status"></div>
    <div class="security"><b>Private by design</b><br>Credentials stay in this browser's local storage. Never commit a real token to GitHub.</div>
  </section>
</main>
<script>
const saved=localStorage.getItem("tickscope_api"); if(saved) document.getElementById("apiUrl").value=saved;
async function connect(){
 const api=document.getElementById("apiUrl").value.trim().replace(/\/$/,"");
 const token=document.getElementById("token").value.trim();
 const s=document.getElementById("status");
 if(!api||!token){s.textContent="API URL and token are required.";return;}
 s.textContent="Testing connection…";
 try{
  const r=await fetch(api+"/api/health",{headers:{Authorization:"Bearer "+token}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  localStorage.setItem("tickscope_api",api); localStorage.setItem("tickscope_token",token);
  s.textContent="Connected.";
  setTimeout(()=>location.href="index.html",250);
 }catch(e){s.textContent="Connection failed. Check the URL, port, CORS and token.";}
}
</script>
</body></html>
