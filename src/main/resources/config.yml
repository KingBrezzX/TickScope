# ============================================================
# TickScope - Main Configuration
# ============================================================
# Semua nilai di file ini sengaja dibuat configurable.
# Setelah mengubah config, gunakan /tickscope reload bila tersedia.
#
# CATATAN:
# server.ip/server.port = alamat Minecraft yang ditampilkan di web.
# web.host/web.port      = alamat tempat API TickScope LISTEN.
# Jangan samakan keduanya kecuali memang allocation-nya sama.
# ============================================================

server:
  # Nama server yang ditampilkan dashboard.
  name: "ZyrexSMP"

  # IP/domain Minecraft Java server.
  # Contoh: business3.astrixhost.web.id
  ip: "business3.astrixhost.web.id"

  # Port Minecraft Java server.
  # Contoh dari allocation kamu: 5066
  port: 5066

language:
  # Bahasa default plugin.
  # id = Indonesia
  # en = English
  # vi = Vietnamese
  # zh = Chinese (Simplified)
  # ko = Korean
  # ru = Russian
  # th = Thai
  default: "id"

  available:
    - "id"
    - "en"
    - "vi"
    - "zh"
    - "ko"
    - "ru"
    - "th"

monitor:
  enabled: true
  metrics-interval-ms: 1000
  interval-ms: 1000

thresholds:
  warning-mspt: 40.0
  critical-mspt: 50.0
  spike-mspt: 50.0

analysis:
  chunks: true
  entities: true
  tile-entities: true
  redstone: true
  block-updates: true
  fluids: true
  player-activity: true
  chunk-loading: true

hotspots:
  enabled: true
  scan-interval-ms: 5000
  radius: 32
  max-results: 50
  max-loaded-chunks: 1000
  track-nearby-player: true
  accurate-coordinates: true

history:
  enabled: true
  retention-days: 7
  cleanup-interval-hours: 24
  max-spikes: 200

recommendations:
  enabled: true
  automatic: true

spikes:
  interval-ms: 1000

# ============================================================
# TickScope API / Web
# ============================================================
web:
  enabled: true

  # Interface bind API.
  # 127.0.0.1 = hanya server itu sendiri.
  # 0.0.0.0   = bisa menerima koneksi dari allocation/network hosting.
  host: "0.0.0.0"

  # PORT KHUSUS TICKSCOPE API.
  # Contoh allocation kedua kamu: 19132.
  # Jika port ini dipakai Geyser/layanan lain, gunakan allocation kosong lain.
  port: 19132

  # URL HTTPS publik yang dipakai GitHub Pages/custom web.
  # Contoh: https://api.zyrexsmp.com
  # Kosongkan jika belum punya public HTTPS endpoint.
  public-url: ""

  cors:
    enabled: true

    # "*" = izinkan browser client dari origin mana pun.
    # Untuk production, lebih aman isi domain web yang kamu percaya.
    #
    # Contoh:
    # allowed-origins:
    #   - "https://username.github.io"
    #   - "https://web.zyrexsmp.com"
    allowed-origins:
      - "*"

  authentication:
    # Jika true, endpoint API membutuhkan satu Key TickScope.
    enabled: true

    # true = plugin membuat TS_... otomatis jika belum ada.
    # Key disimpan di server, BUKAN di GitHub repository.
    auto-generate-token: true

  realtime:
    enabled: true
    interval-ms: 1000

# ============================================================
# Admin actions
# ============================================================
admin-actions:
  enabled: true

  break:
    # 0 = hanya target/core yang ditentukan.
    # Ubah sesuai kebutuhan.
    radius: 0

    replace-core-with-sign: true

  sign:
    lines:
      - "&c&lLAG MACHINE"
      - "&7Disabled by"
      - "&bTickScope"
      - "&8Admin Action"

  ban:
    enabled: true

    # Bisa diubah sesuka kamu.
    duration-days: 7

    # Alasan ban bisa diubah.
    reason: "Lag machine detected"

    # Jika true, action destroy dari admin dapat memicu ban
    # sesuai implementasi/plugin permission yang digunakan.
    auto-ban-on-destroy: true
