- name: Download Paper 26.2
  shell: bash
  run: |
    set -euo pipefail

    PAPER_VERSION="26.2"
    USER_AGENT="TickScope-CI/1.0 (https://github.com/KingBrezzX/TickScope)"

    echo "Fetching Paper $PAPER_VERSION stable build..."

    BUILDS_JSON="$(curl -fsSL \
      -H "User-Agent: ${USER_AGENT}" \
      -H "Accept: application/json" \
      "https://fill.papermc.io/v3/projects/paper/versions/${PAPER_VERSION}/builds")"

    PAPER_URL="$(echo "$BUILDS_JSON" | python3 -c '
import json, sys

data = json.load(sys.stdin)

stable = [
    b for b in data
    if b.get("channel") == "STABLE"
    and b.get("downloads", {}).get("server:default", {}).get("url")
]

if not stable:
    raise SystemExit("No stable Paper build found")

stable.sort(key=lambda b: b.get("id", 0), reverse=True)

print(stable[0]["downloads"]["server:default"]["url"])
')"

    PAPER_BUILD="$(echo "$BUILDS_JSON" | python3 -c '
import json, sys

data = json.load(sys.stdin)

stable = [
    b for b in data
    if b.get("channel") == "STABLE"
]

stable.sort(key=lambda b: b.get("id", 0), reverse=True)

print(stable[0]["id"])
')"

    echo "Paper build: ${PAPER_BUILD}"
    echo "Download URL: ${PAPER_URL}"

    curl -fL \
      -H "User-Agent: ${USER_AGENT}" \
      -o paper.jar \
      "$PAPER_URL"

    test -s paper.jar

    echo "Paper downloaded successfully:"
    ls -lh paper.jar
