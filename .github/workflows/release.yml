name: Release TickScope

on:
  workflow_dispatch:

jobs:
  release-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B --no-transfer-progress -DskipTests clean package
      - name: SHA-256
        run: sha256sum target/TickScope-1.0.0.jar | tee target/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TickScope-release
          path: |
            target/TickScope-1.0.0.jar
            target/SHA256SUMS.txt
