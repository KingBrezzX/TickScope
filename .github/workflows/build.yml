name: Build TickScope

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java
        run: java --version

      - name: Validate Maven project
        run: mvn -B validate

      - name: Build plugin
        run: mvn -B -DskipTests package

      - name: Validate web JavaScript
        run: |
          node --check web/app.js
          node --check web/config.js
          node --check web/spikes.js
          node --check web/logout.js

      - name: Validate plugin resources
        run: |
          test -f target/TickScope-1.0.0.jar
          jar tf target/TickScope-1.0.0.jar | grep -q '^plugin.yml$'
          jar tf target/TickScope-1.0.0.jar | grep -q '^web/index.html$'
          jar tf target/TickScope-1.0.0.jar | grep -q '^web/app.js$'
          jar tf target/TickScope-1.0.0.jar | grep -q '^web/config.js$'

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: TickScope-${{ github.sha }}
          path: target/TickScope-1.0.0.jar
          if-no-files-found: error

